# Runs the two checks that catch what would otherwise reach a hallway screen
# as a blank board: the types, and a real production build. Both are the same
# commands the LAN host runs at deploy time (docs/deploy-lan.md), so a green run
# here means the deploy's build will not be the thing that fails.
#
# On main it then deploys the cloud half — but only for a school that has one;
# see the `deploy` job at the bottom.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the run still going for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` and not `npm install`: it installs exactly the lockfile, the
      # same way the deploy does, so CI cannot pass on a dependency tree the
      # LAN host will never see.
      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

  # The cloud half of the deployment. A school running only corridor screens
  # never sets these repository variables, so this job is simply skipped — no
  # red X for a cloud it doesn't have. Setup: docs/deploy-cloud.md.
  deploy:
    name: deploy to Cloud Run
    needs: check
    if: github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Workload Identity Federation mints a short-lived token for this run, so
      # no service-account key is ever stored in GitHub.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # Built here rather than by `gcloud run deploy --source`, which has no way
      # to pass a build argument — and without GIT_SHA every cloud build would
      # call itself "los" in the corner stamp.
      - name: Build and push the image
        run: |
          IMAGE="${{ vars.CLOUD_RUN_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/infobord:${{ github.sha }}"
          gcloud auth configure-docker "${{ vars.CLOUD_RUN_REGION }}-docker.pkg.dev" --quiet
          docker build --build-arg GIT_SHA="${{ github.sha }}" -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Only the image changes here. SHEET_ID, PUPIL_DATA and the ranges are set
      # on the service once and survive a deploy untouched, so a school's own
      # settings can't be overwritten by a merge.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}" \
            --image "$IMAGE" \
            --region "${{ vars.CLOUD_RUN_REGION }}" \
            --quiet
