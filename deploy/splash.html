<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google" content="notranslate" />
    <title>Infobord — verbinden…</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fdfaf7;
        color: #2a2420;
        font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
        cursor: none;
        user-select: none;
      }
      .box {
        text-align: center;
      }
      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 26px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 36px;
        font-weight: 800;
      }
      p {
        margin: 0;
        font-size: 18px;
        color: #6b625a;
      }
      .dots {
        margin-top: 22px;
        display: flex;
        gap: 9px;
        justify-content: center;
      }
      .dots i {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #ec674a;
        animation: blink 1.2s infinite ease-in-out;
      }
      .dots i:nth-child(2) {
        animation-delay: 0.2s;
      }
      .dots i:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes blink {
        0%,
        80%,
        100% {
          opacity: 0.25;
        }
        40% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="box">
      <svg class="mark" viewBox="8 8 54 62" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <polygon points="30,10 55,20 45,45 60,60 30,68 15,55 10,30" fill="#ec674a" />
        <polygon points="30,10 45,45 15,55 10,30" fill="#d99a22" opacity="0.85" />
        <polygon points="10,30 15,55 30,68" fill="#51a3c4" opacity="0.85" />
      </svg>
      <h1>Infobord</h1>
      <p id="msg">Verbinden met het infobord…</p>
      <div class="dots"><i></i><i></i><i></i></div>
    </div>
    <script>
      // Boot lands here first — a local file that always loads. It probes the
      // board host with an <img> (works cross-origin from file://) and forwards
      // to the board the moment it answers, so a screen booting while the host
      // is still down shows this splash instead of Chromium's error page, and
      // self-heals with fresh data rather than a stale cache.
      (function () {
        var board = new URLSearchParams(location.search).get("board");
        if (!board) {
          document.getElementById("msg").textContent =
            "Geen board-URL ingesteld.";
          return;
        }
        var origin;
        try {
          origin = new URL(board).origin;
        } catch (e) {
          origin = board.replace(/\/[^/]*$/, "");
        }
        function probe() {
          var img = new Image();
          img.onload = function () {
            location.replace(board);
          };
          img.onerror = function () {
            setTimeout(probe, 2000);
          };
          img.src = origin + "/ping.png?t=" + Date.now();
        }
        probe();
      })();
    </script>
  </body>
</html>
